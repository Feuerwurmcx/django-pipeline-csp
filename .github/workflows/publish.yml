name: Publish to PyPI

# Veroeffentlicht auf PyPI, sobald ein GitHub-Release erstellt wird.
# Trusted Publishing (OIDC): im Repository liegt kein API-Token.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Build sdist and wheel
        run: uv build
      - name: Check metadata
        run: uvx twine check dist/*
      - name: Smoke-install the built wheel
        # django-pipeline itself reads Django settings (PIPELINE, DEBUG) at
        # import time, so even a bare `import pipeline_csp...` needs Django
        # settings configured first -- this is upstream django-pipeline
        # behaviour, not specific to this package.
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke dist/*.whl
          /tmp/smoke/bin/python -c "
          import django
          from django.conf import settings
          settings.configure(INSTALLED_APPS=['django.contrib.staticfiles', 'pipeline', 'pipeline_csp'], STATIC_URL='/static/', PIPELINE={})
          import pipeline_csp.templatetags.pipeline_csp
          print('import OK')
          "
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/django-pipeline-csp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
